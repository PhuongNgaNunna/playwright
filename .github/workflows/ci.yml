name: Playwright API Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to run tests against'
        required: false
        default: 'staging'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Log environment (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: 'echo "Running on env: ${{ inputs.env }}"'

      - name: Run Playwright tests
        run: npx playwright test tests/exam4-buggy.spec.ts

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Add report link to summary
        if: always()
        run: |
          echo "## 🎭 Playwright Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Report | [Download Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
